<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Empeeeee đáng iu của anh ❤️</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #btn-start {
            position: absolute;
            z-index: 10;
            padding: 15px 40px;
            font-size: 1.5rem;
            color: #fff;
            background-color: #ff3366;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff3366, 0 0 30px #ff3366;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            transition: all 0.3s ease;
        }

        #btn-start:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px #ff3366, 0 0 50px #ff3366;
        }

        .text {
            position: absolute;
            z-index: 2;
            color: #ffb3c6;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.8rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 5px #ff3366, 0 0 15px #ff3366, 0 0 25px #ff3366;
            pointer-events: none;
            padding: 0 20px;
            margin-top: 160px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .center-image {
            position: absolute;
            z-index: 2;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 15px #ff3366, 0 0 30px #ff3366;
            margin-top: -30px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .show {
            opacity: 1 !important;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        /* Hiệu ứng hạt li ti lấp lánh (nền) dày đặc hơn */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            border-radius: 50%;
        }

        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.5) translateY(0); }
            50% { opacity: 1; box-shadow: 0 0 10px #ff3366; }
            100% { opacity: 0; transform: scale(1.2) translateY(-20px); }
        }

        @media (max-width: 500px) {
            .text {
                font-size: 1.4rem;
                margin-top: 130px;
                padding: 0 10px;
            }
            .center-image {
                width: 120px;
                height: 120px;
            }
            button {
                font-size: 16px;
                padding: 8px 16px;
            }
        }
    </style>
</head>

                } else if (animationState === 2) { 
                    // Giai đoạn 2 (6-10s): Vẽ khung trái tim
                    var currentAngle = (elapsed - 6) * 2; 
                    if (elapsed > 10) {
                        animationState = 3; 
                        document.querySelector('.center-image').classList.add('show');
                        document.querySelector('.text').classList.add('show');
                    }
                    for (var i = 0; i < amount * 1.5; i++) {
                        var t = currentAngle + (Math.random() - 0.5) * 0.8;
                        var pos = pointOnHeart(t);
                        var dir = pos.clone().length(settings.particles.velocity);
                        particles.add(canvas.width / 2 + pos.x, canvas.height / 2 - pos.y, dir.x, -dir.y);
                    }
                } else if (animationState === 3) {
                    // Giai đoạn 3 (Sau 10s): Trái tim đầy đập nhịp nhàng, hiện ảnh và chữ
                    for (var i = 0; i < amount; i++) {
                        var t = Math.PI - 2 * Math.PI * Math.random();
                        var pos = pointOnHeart(t);
                        var dir = pos.clone().length(settings.particles.velocity);
                        particles.add(canvas.width / 2 + pos.x, canvas.height / 2 - pos.y, dir.x, -dir.y);
                    }
                }

                particles.update(deltaTime);
                particles.draw(context, image);
            }

            function onResize() {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
            }
            window.onresize = onResize;

            setTimeout(function () {
                onResize();
                render();
            }, 10);

            var image = getPointImage();
        })(document.getElementById('pinkboard'));

        // Sinh ra các hạt li ti lấp lánh nền (tăng số lượng rất nhiều)
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 800; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            
            const duration = Math.random() * 3 + 2;
            const delay = Math.random() * 3;
            star.style.animation = `twinkle ${duration}s infinite alternate ${delay}s`;
            
            star.style.backgroundColor = Math.random() > 0.6 ? '#ffb3c6' : '#fff'; 
            
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
